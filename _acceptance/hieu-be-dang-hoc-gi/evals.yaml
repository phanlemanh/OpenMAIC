schema_version: 1
feature_slug: hieu-be-dang-hoc-gi
evals:
  - id: E1
    criterion: AC-1
    executor: ui-check
    layer: ui-observed
    steps:
      - "Dựng máy chủ phát triển theo config dev_server.start NHƯNG BỎ biến NEXT_PUBLIC_PERSISTENCE (lối local-first). Lý do: cờ ấy bật phạm vi tài khoản mà máy đo không có cơ sở dữ liệu, nên mọi lượt ghi bị từ chối và các trạng thái «đã lưu» / «nhớ qua tải lại» KHÔNG dựng được — không phải lỗi sản phẩm, mà là một cấu hình không dùng được. Lối local-first là cấu hình người tự dựng thật sự chạy, và hồ sơ lưu bền qua trình duyệt ở đó."
      - "Mở {url} với hồ sơ trống → Cài đặt → mục «Người học» → chụp evidence/E1-the-trong.png (nút Lưu mờ)"
      - "Điền tên gọi, chọn lớp 7, thêm dòng môn Toán · Cambridge Lower Secondary · tiếng Anh → chụp evidence/E1-the-dang-dien.png"
      - "Quan sát dòng môn hiện «có gói khung» kèm tên sách → chụp evidence/E1-mon-co-goi.png"
      - "Thêm dòng môn Toán · MOET · tiếng Việt → dòng hiện «chưa có gói — máy sẽ đoán» → chụp evidence/E1-mon-chua-goi.png"
      - "Bấm Lưu → trong lúc đọc lại để xác nhận, nút Lưu mờ → chụp evidence/E1-dang-luu.png. Khung này ở lối local-first chỉ kéo dài dưới một khung hình (ngăn lưu là trình duyệt, không có mạng để làm chậm), nên PNG thường không kịp: khi ấy bắt bằng bản chụp DOM SỐNG — cài MutationObserver trên thẻ trước khi bấm Lưu, ghi outerHTML đúng lúc data-state đổi sang ST-the-dang-luu vào evidence/E1-dang-luu.html — và KHÔNG đặt tên dang-luu cho một PNG chụp trạng thái khác."
      - "Sau xác nhận: toast đã lưu, tải lại trang, mở lại mục → giá trị còn nguyên → chụp evidence/E1-da-luu.png"
      - "Trên hồ sơ ĐÃ LƯU: đổi lớp 7 → lớp 8 trên dòng Cambridge → dòng chuyển sang «chưa có gói» (chưa có gói Stage 9) → chụp evidence/E1-doi-lop.png; trả lại lớp 7"
      - "Ép ghi hỏng: chặn tuyến /api/persistence/kv trả 500 bằng công cụ trình duyệt → đổi một giá trị → Lưu → chụp evidence/E1-loi-luu.png (toast «chưa lưu được — giá trị vẫn giữ trên màn» VÀ giá trị vừa gõ còn trên form, KHÔNG có toast đã lưu)"
      - "Bớt dòng môn đang được ô «Soạn cho» nhớ → về trang chủ → ô rơi về môn còn lại, không giữ lựa chọn mồ côi → chụp evidence/E1-bot-mon.png"
      - "MỌI khung phải là chụp SỐNG; khung nào không dựng được thì khai thẳng."
    expected: "exit 0; đủ BẢY khung sống — ST-the-trong, ST-the-dang-dien, ST-the-mon-co-goi, ST-the-mon-chua-goi, ST-the-da-luu, ST-the-loi-luu, cộng khung đổi-lớp; và khung bớt-môn cho AC-5. LUẬT PHỦ KHUNG: mỗi dòng ST-the-* trong bảng trạng thái của design-doc phải có ít nhất một khung ở phép đo này (BẢY dòng, gồm ST-the-dang-luu); hai khung đổi-lớp và bớt-môn là khung hành vi, chụp thêm chứ không thay dòng nào; thiếu một dòng → đỏ nêu ĐÍCH DANH tên dòng thiếu. Riêng dòng ST-the-dang-luu: khung sống được phép là bản chụp DOM (evidence/E1-dang-luu.html, bắt bằng MutationObserver lúc data-state đổi) khi PNG không kịp; một PNG mang tên dang-luu mà chụp trạng thái khác → đỏ ghim 'frame mislabeled: ST-the-dang-luu'. Sau tải lại giá trị còn nguyên. Các phản hồi sau là ĐÚNG THIẾT KẾ, không phải lỗi: 404 ở GET /api/stages và GET /api/folders (chỉ phục vụ khi bộ chạy agent bật), và 404 ở GET /api/persistence/kv/* nếu lối máy chủ không bật; 500 ở tuyến kv trong bước ép-ghi-hỏng là do chính người đo dựng, cũng đúng thiết kế; mọi 4xx/5xx khác trên cùng origin là đỏ. Chiều đỏ: (a) thiếu một khung → đỏ nêu tên dòng; (b) dòng môn Cambridge lớp 7 KHÔNG hiện «có gói» → đỏ; (c) lúc ghi hỏng mà màn báo đã lưu → đỏ ghim 'save reported success while the write failed'."
    paths: ["components/settings/learner-profile-settings.tsx", "components/settings/index.tsx", "lib/store/learner-profile.ts", "app/api/curriculum-packs/**", "app/page.tsx"]
    evidence_required: [run_id, exit_code, verifier, verified_at, screenshot]

  - id: E1b
    criterion: AC-1
    executor: test
    cmd: config:executors.test.api
    expected: "exit 0; chốt máy cho việc lưu hồ sơ, không qua giao diện: kho hồ sơ người học nhận một hồ sơ hợp lệ (tên gọi, lớp, hai dòng môn) → đọc lại sau khi nạp lại kho trả đúng giá trị đã ghi; hồ sơ thiếu tên gọi, thiếu lớp, hoặc không dòng môn nào đủ ba trường thì bị coi là CHƯA hợp lệ (cờ hợp-lệ tắt), tức nút Lưu không có gì để bật. Trạng thái gói của từng dòng môn tính bằng bộ đăng ký, không lưu cứng. Chiều đỏ trên cùng fixture: cho trạng thái gói ghi cứng vào hồ sơ lúc lưu → đỏ ghim 'pack match frozen into the stored profile'."
    paths: ["lib/store/learner-profile.ts", "lib/server/curriculum-packs.ts"]
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.api
    expected: "exit 0; bộ đăng ký gói với fixture hai gói giả (Toán Cambridge stage 8 khai grades.vn ['lớp 7'], Toán Cambridge stage 9 khai ['lớp 8']): (Toán, cambridge-lower-secondary, 'lớp 7') → gói stage 8; đổi 'lớp 8' → gói stage 9; (Toán, moet, 'lớp 7') → null; gói JSON hỏng bị bỏ qua kèm cảnh báo có tên tệp, hai gói lành vẫn nạp. Chiều đỏ trên cùng fixture: bỏ bộ lọc lớp → đỏ với thông điệp ghim 'pack matched without grade equivalence'."
    paths: ["lib/server/curriculum-packs.ts", "skills/agent-runtime/*/curriculum-pack.json"]
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E3
    criterion: AC-3
    executor: test
    layer: backend-effect
    cmd: config:executors.test.api
    expected: "exit 0; tập kho phạm vi account rút từ khai báo (bài kiểm ma trận toàn phần sẵn có) nay gồm learner-profile-storage; phiên thứ hai của cùng chủ sở hữu đọc được hồ sơ phiên một đã ghi. Chiều đỏ trên cùng fixture: bỏ dòng đăng ký kho hồ sơ khỏi account-stores → đỏ với thông điệp ghim 'account key set drifted from the declared scope: learner-profile-storage'."
    paths: ["lib/store/account-stores.ts", "lib/store/learner-profile.ts", "lib/store/kv-persist.ts"]
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.api
    expected: "exit 0; «xoá bộ nhớ đệm» gọi clearPersistedStore cho đủ mọi kho phạm vi account, danh sách rút từ account-stores — kho hồ sơ người học có trong đó; và trên máy chủ KHÔNG còn tệp nào nhắc tới một khoá bản chụp riêng của hồ sơ (learner-profile.snapshot) — xoá ở thẻ là xoá bản duy nhất. Chiều đỏ: bỏ kho hồ sơ khỏi danh sách xoá → đỏ với thông điệp ghim 'clear-cache skipped an account store: learner-profile-storage'; máy chủ ghi hồ sơ ra khoá riêng → đỏ ghim 'orphan learner snapshot key still referenced'."
    paths: ["components/settings/general-settings.tsx", "lib/store/account-stores.ts", "lib/server/agent-runtime/learner-context.ts", "lib/server/agent-runtime/runner.ts"]
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E5
    criterion: AC-5
    executor: ui-check
    layer: ui-observed
    steps:
      - "Dựng máy chủ phát triển theo config dev_server.start"
      - "Mở {url} với hồ sơ trống → dưới lời chào có dòng mời khai, KHÔNG có ô «Soạn cho» → chụp evidence/E5-moi-khai.png"
      - "Khai hồ sơ có hai môn (Toán Cambridge, Toán MOET) → về trang chủ → ô «Soạn cho: Toán — Cambridge (tiếng Anh) ▾» → chụp evidence/E5-san-sang.png"
      - "Đổi sang Toán — MOET, tải lại trang → ô vẫn ở MOET (nhớ lựa chọn) → chụp evidence/E5-nho-lua-chon.png"
      - "Xoá hồ sơ đi, soạn một dàn ý bất kỳ → màn xem trước KHÔNG có dòng neo nào → chụp evidence/E5-neo-khong.png"
      - "Dựng máy chủ như E1: BỎ biến NEXT_PUBLIC_PERSISTENCE (lối local-first), nếu không hồ sơ không lưu bền được và khung «nhớ lựa chọn qua tải lại» không dựng được."
    expected: "exit 0; bốn khung sống phủ ST-chon-moi-khai (không ô), ST-chon-san-sang (ô đúng nhãn môn — chương trình (ngôn ngữ)), lựa chọn nhớ qua tải lại, và ST-neo-khong (hồ sơ trống → màn xem trước không dòng neo, y như trước vòng). LUẬT PHỦ KHUNG: ba dòng ST-chon-moi-khai, ST-chon-san-sang và ST-neo-khong mỗi dòng phải có ít nhất một khung ở phép đo này; thiếu một dòng → đỏ nêu ĐÍCH DANH tên dòng. Nhãn ô phải nêu ĐỦ ba phần «môn — chương trình (ngôn ngữ)». Các 404 ở /api/stages và /api/folders là đúng thiết kế (bộ chạy agent tắt). Chiều đỏ: ô hiện khi hồ sơ trống, nhãn thiếu chương trình HOẶC thiếu ngôn ngữ, hoặc hồ sơ trống mà vẫn có dòng neo → đỏ nêu đích danh khung."
    paths: ["app/page.tsx", "lib/store/learner-profile.ts"]
    evidence_required: [run_id, exit_code, verifier, verified_at, screenshot]

  - id: E5b
    criterion: AC-5
    executor: test
    cmd: config:executors.test.api
    expected: "exit 0; chốt máy cho bộ chọn môn, hàm thuần: hồ sơ trống → không môn nào chọn được (ô không dựng); hồ sơ một môn → chọn chính môn đó; hồ sơ nhiều môn và có lựa chọn nhớ hợp lệ → giữ lựa chọn nhớ; lựa chọn nhớ trỏ một môn ĐÃ BỊ XOÁ → rơi về môn đầu còn lại, không trả mã mồ côi; hồ sơ trống sau khi từng có → xoá luôn lựa chọn nhớ. Bốn nhánh, bốn assert. Chiều đỏ trên cùng fixture: trả thẳng lựa chọn nhớ không kiểm còn tồn tại → đỏ ghim 'remembered subject survived its own deletion'."
    paths: ["app/page.tsx", "lib/store/learner-profile.ts"]
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E6
    criterion: AC-6
    executor: test
    layer: backend-effect
    cmd: config:executors.test.generation
    expected: "exit 0; với UserRequirements.learner có môn Toán Cambridge kèm thân gói fixture, buildOutlinePrompt cho ra prompt chứa khối hồ sơ đúng bản vàng của formatLearnerContext VÀ thân gói ở vị trí {{curriculumContext}}; không còn chuỗi '{{' nào trong system lẫn user prompt; kiểm bằng grep mã nguồn rằng ba bản chép tay cũ (outline-generator, scene-outlines-stream, generation-preview) không còn — chỉ một hàm định dạng. Chiều đỏ trên cùng fixture: (a) thêm một ô {{ghost}} vào template → đỏ với thông điệp ghim 'unresolved template variable: {{ghost}}'; (b) đổi một chữ trong bản vàng → đỏ nêu diff."
    paths: ["packages/@openmaic/generation/src/prompt-formatters.ts", "packages/@openmaic/generation/src/outline-generator.ts", "packages/@openmaic/generation/templates/requirements-to-outlines/**", "packages/@openmaic/generation/src/prompts/loader.ts", "app/api/generate/scene-outlines-stream/route.ts", "lib/prompts/templates/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E7
    criterion: AC-7
    executor: ui-check
    layer: ui-observed
    steps:
      - "Dựng máy chủ phát triển theo config dev_server.start (cần khoá mô hình phía máy chủ; không có → khai thẳng, hạ về khung HTML tĩnh của dòng neo với dữ liệu giả và nói rõ)"
      - "Hồ sơ có Toán Cambridge lớp 7; ô «Soạn cho» ở Toán — Cambridge; gõ «tỉ lệ và tỉ số» → Tạo → màn xem trước"
      - "Dòng neo hiện trên đầu dàn ý: tên unit + tên sách, mã (nếu có) in nhỏ phía sau → chụp evidence/E7-neo-co-goi.png"
      - "Ghi evidence/E7-network.txt: sự kiện SSE curriculumAnchor có mặt trong luồng dàn ý (máy chủ suy từ gói + dàn ý; mô hình không được hỏi)"
    expected: "exit 0; MỘT khung sống phủ dòng ST-neo-co-goi (luật phủ khung); khung ST-neo-co-goi với dòng neo đọc được bằng ngôn ngữ người học, tên unit đứng trước, không mã đứng trước; luồng SSE có sự kiện curriculumAnchor do máy chủ suy từ gói + dàn ý. Các phản hồi sau là ĐÚNG THIẾT KẾ, không phải lỗi: 404 ở GET /api/stages và GET /api/folders (chỉ phục vụ khi bộ chạy agent bật), và 404 ở GET /api/persistence/kv/* khi lối máy chủ không bật; mọi 4xx/5xx khác trên cùng origin là đỏ. Chiều đỏ: dàn ý sinh xong từ môn có gói mà không dòng neo, hoặc dòng neo mở đầu bằng mã / có chữ «Stage» → đỏ nêu đích danh."
    paths: ["app/generation-preview/page.tsx", "components/generation/outlines-editor.tsx", "app/api/generate/scene-outlines-stream/route.ts"]
    evidence_required: [run_id, exit_code, verifier, verified_at, screenshot]

  - id: E7b
    criterion: AC-7
    executor: test
    layer: backend-effect
    cmd: config:executors.test.api
    expected: "exit 0; phép đo ĐẦU-CUỐI qua chính tuyến HTTP, mô hình giả ghi lại prompt nó nhận: POST /api/generate/scene-outlines-stream với thân yêu cầu chứa learner (môn Toán · cambridge-lower-secondary · lớp 7) và KHÔNG chứa thân gói — route phải tự tra bộ đăng ký, đọc thân gói, đặt vào ô curriculumContext. Ba assert trên cùng một lượt gọi: (a) prompt mô hình giả nhận được CHỨA thân gói fixture tại đúng ô; (b) prompt chứa khối hồ sơ do bộ định dạng chung sinh; (c) route phát sự kiện {type:'curriculumAnchor', data:<chuỗi>} khi tra được gói — chuỗi SUY từ gói + đề + dàn ý (tên unit trước, tên sách sau), KHÔNG lấy từ đầu ra mô hình: mô hình tự trả một khoá curriculumAnchor thì bị bỏ qua; không gói → không sự kiện; (d) prompt mô hình giả nhận KHÔNG chứa lời xin câu neo. Đây là phép đo DUY NHẤT bắt nhịp yêu cầu → route → tra gói → prompt; E7 (chụp sống) KHÔNG được thay thế nó. Chiều đỏ trên cùng fixture: (a) bỏ dòng tra gói trong route → đỏ ghim 'learner dropped between request and outline prompt'; (b) route chuyển learner sang bộ dựng prompt nhưng bỏ thân gói → đỏ ghim 'curriculum pack body missing from outline prompt'; (c) bỏ nhánh phát sự kiện → đỏ ghim 'curriculumAnchor event missing from outline stream'; (d) route lấy câu neo từ mô hình → đỏ ghim 'anchor taken from the model instead of derived'; (e) một khuôn dàn ý xin lại khoá thứ tư → đỏ ghim 'template still asks the model for curriculumAnchor'; (f) bộ sinh dàn ý đọc lại khoá ấy → đỏ ghim 'generator still parses a model anchor'."
    paths: ["app/api/generate/scene-outlines-stream/route.ts", "packages/@openmaic/generation/src/outline-generator.ts", "lib/server/curriculum-packs.ts", "lib/server/curriculum-anchor.ts", "packages/@openmaic/generation/src/prompt-formatters.ts", "packages/@openmaic/generation/templates/requirements-to-outlines/**", "lib/prompts/templates/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E7c
    criterion: AC-7
    executor: test
    cmd: config:executors.test.api
    expected: "exit 0; câu neo là hàm THUẦN trên gói + đề + dàn ý, đo không cần mô hình: đề «tỉ lệ và tỉ số» khớp Unit 12 qua tên tiếng Việt của unit; ngôn ngữ của môn quyết định tên unit hiện (en-US → «Ratio and proportion», vi-VN → «Tỉ số và tỉ lệ»); đề mơ hồ nhưng dàn ý nói rõ → unit lấy từ dàn ý; nhiều unit chạm → unit khớp nhiều cụm hơn thắng; không unit nào khớp → CHỈ tên sách; không chữ «Stage», không mở đầu bằng mã; gói không có sách → null. Dấu tiếng Việt gấp về NFC trước khi so. Chiều đỏ trên cùng fixture: không unit khớp mà vẫn nêu unit → đỏ ghim 'anchor invented a unit the outline never mentions'; chọn sai unit → 'anchor names the wrong unit'; lộ chữ Stage → 'anchor exposes a framework stage to the parent'."
    paths: ["lib/server/curriculum-anchor.ts", "skills/agent-runtime/cambridge-lower-secondary-maths-8/curriculum-pack.json"]
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E8
    criterion: AC-8
    executor: test
    cmd: config:executors.test.generation
    expected: "exit 0; formatLearnerContext với dòng môn có curriculum 'moet' và không packId cho ra khối chứa đúng câu khai «chưa có gói khung» + «neo chưa kiểm chứng» (bản vàng); learnerPromptBlock phía agent GỌI chính hàm đó nên cho cùng câu — assert bằng cách so chuỗi con, không so hai bản vàng riêng. Chiều đỏ trên cùng fixture: xoá câu khai → đỏ với thông điệp ghim 'guess mode not declared for subject without pack'."
    paths: ["packages/@openmaic/generation/src/prompt-formatters.ts", "lib/server/agent-runtime/learner-context.ts"]
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E8b
    criterion: AC-8
    executor: ui-check
    layer: ui-observed
    steps:
      - "Như E7 nhưng ô «Soạn cho» ở Toán — MOET (chưa có gói) → màn xem trước"
