# 2-space indentation REQUIRED — the kit's hook parses this file line-by-line.
schema_version: 1
enforcement: strict          # strict | warn | off
gap_probe: advisory          # required | advisory | off
recheck: strict              # CI re-check of COMMITTED evidence (fresh repo → strict is safe)

executors:
  test:
    api: "./scripts/with-pinned-node.sh pnpm test"                                      # suy từ: package.json "test" + .github/workflows/ci.yml "Unit Tests"
    e2e_web: "./scripts/with-pinned-node.sh pnpm test:e2e"                              # suy từ: playwright.config.ts + ci.yml job "e2e"
    storage: "./scripts/with-pinned-node.sh pnpm --filter @openmaic/storage test"       # suy từ: ci.yml "Unit Tests (storage)"
    generation: "./scripts/with-pinned-node.sh pnpm --filter @openmaic/generation test" # suy từ: ci.yml "Unit Tests (generation)"
    importer: "./scripts/with-pinned-node.sh pnpm --filter @openmaic/importer test"     # suy từ: ci.yml "Unit Tests (importer)"
    dsl: "./scripts/with-pinned-node.sh pnpm --filter @openmaic/dsl test"               # suy từ: ci.yml "Unit Tests (dsl)"
    render_service: "./scripts/with-pinned-node.sh npm --prefix render-service test"    # suy từ: ci.yml job "render-service"
  # Executor trỏ vào scripts/ TRONG repo, không vào plugin cache: file này được
  # commit, mà đường dẫn cache khác nhau theo từng máy/từng user.
  script:
    # cli: repo KHÔNG có CLI người dùng — bỏ trống có chủ đích.
    # Ứng viên gần nhất là scripts/generation-node-smoke.mjs nhưng nó cần server chạy trước.  # cần anh nếu muốn bật
    product_map: "./scripts/with-pinned-node.sh node scripts/product-map.mjs --root . --check"
    # Bọc trong with-dev-server.sh: phép đo này đòi một máy chủ đang chạy, và
    # một phép đo đòi điều kiện mà không tự dựng được nó thì chỉ là một điều
    # kiện ngầm — lượt nghiệm thu vòng 2 bị chặn đúng vì thế.
    # Mô hình nêu ĐÍCH DANH: tuyến soạn giải mô hình từ x-model (trang chủ luôn
    # gửi), nên một script không gửi đi một đường khác đường thật — và trên bản
    # dựng không khai DEFAULT_MODEL thì tuyến trả 500, đúng ca chặn vòng 3.
    # Ghi ở đây để cặp dàn ý mù lặp lại được: ai chấm cũng biết nó sinh bằng gì.
    # `env -u ANTHROPIC_BASE_URL`: vỏ của một số công cụ xuất sẵn biến này trỏ
    # GỐC api (không có đoạn phiên bản), và máy chủ kế thừa nó thì mọi lượt gọi
    # rơi vào một đường 404 — lượt soạn trả rỗng mà không nói vì sao. Bỏ biến đi
    # để phép đo chạy trên cấu hình mặc định của kho; ai cần gốc riêng thì đổi
    # OPENMAIC_MODEL sang nhà cung cấp khác hoặc sửa dòng này.
    dan_y_mu: env -u ANTHROPIC_BASE_URL OPENMAIC_MODEL=${OPENMAIC_MODEL:-anthropic:claude-sonnet-5} ./scripts/with-dev-server.sh ./scripts/with-pinned-node.sh node scripts/gen-dan-y-mu.mjs
  design:                                                 # repo có web UI (app/, components/)
    gate: "./scripts/with-pinned-node.sh node scripts/design-gate-changed.mjs"   # chấm mọi file giao diện vòng đụng; design-gate.mjs chỉ nhận MỘT file nên không dùng thẳng làm khoá cấp kho được
    ui_check: "scripts/design-scan.js"

risk_tiers:
  t1_skip_globs:
    - "*.md"                          # suy từ: README/CHANGELOG/CONTRIBUTING/SECURITY ở gốc
    - "packages/docs/**"              # suy từ: pnpm-workspace.yaml loại trừ packages/docs
    - ".github/ISSUE_TEMPLATE/**"
    - "LICENSE"
    # Bản đồ sản phẩm — máy sinh; approve/signoff commit nó CÙNG commit chữ ký.
    # Thiếu dòng này thì chính commit chữ ký làm evidence stale → vòng không thoát (ADR 0007).
    # Miễn trừ CHỈ an toàn vì executors.script.product_map chạy trong CI của repo (xem bước CI bên dưới).
    - "PRODUCT-MAP.md"
    # Bộ cổng vendored theo INIT-CI-COPY-LIST (đường dẫn ĐÍCH DANH, không glob):
    # đây là THƯỚC ĐO, không phải product code — nâng chính cái thước không được
    # làm hết hạn bằng chứng đã ghim, và không được tự chặn lượt nâng nó.
    - "scripts/pre-merge-check.sh"
    - "scripts/recheck-evidence.cjs"
    - "scripts/product-map.mjs"
    - "scripts/trang-thai-ho-so.cjs"
    - "scripts/khong-can-nguoi.mjs"
    - "lib/evidence-core.cjs"
    - "lib/gap-probe.cjs"
    - "lib/workspace-record.cjs"
    - "lib/ac-line.cjs"
    - "lib/md-section.cjs"
    - "lib/eval-yaml.cjs"
    - "lib/lop-nhin-thay.cjs"
    - "lib/nhan-canh-gay.cjs"
    - "lib/nguong-o-co-hoi.cjs"
    - "lib/out-of-contract.cjs"
  t3_paths:
    - "middleware.ts"                 # suy từ: cổng ACCESS_CODE + gate /workbench
    - "lib/server/access-token.ts"    # suy từ: HMAC access token
    - "lib/server/access-token-edge.ts"
    - "lib/server/access-token-shared.ts"
    - "app/api/access-code/**"        # suy từ: whitelist trong middleware.ts
    - "lib/persistence/**"            # suy từ: owner-bound-document-store, document-access, server-auth
    - "app/api/persistence/**"
    - "packages/@openmaic/storage/**" # suy từ: device-scope guard trong ci.yml
    # KHÔNG có bề mặt thanh toán trong repo — không khai t3 payments.

signoff:
  required_for: [T2, T3]
  approvers: ["Manh Phan"]            # suy từ: git config user.name — thông tin, gate KHÔNG cưỡng chế khoá này

dev_server:
  # NEXT_PUBLIC_PERSISTENCE=1 bật phạm vi account: thiếu nó thì mục «Máy của tôi»
  # chỉ dựng được đúng trạng thái TẮT, và một phép đo giao diện sẽ chấm một màn
  # không phải màn người dùng thật thấy.
  start: "PORT=3002 NEXT_PUBLIC_MAIC_EDITOR_ENABLED=true NEXT_PUBLIC_PI_CHAT_ENABLED=true NEXT_PUBLIC_COURSEWARE_REFERENCE_ENABLED=true NEXT_PUBLIC_PERSISTENCE=1 pnpm dev"
  url: "http://localhost:3002"        # suy từ: playwright.config.ts webServer (khớp e2e, bật Pro/editor flags)
  # api_base: app/api nằm cùng origin với url → bỏ trống.
  # render-service là service riêng; khai thêm ở đây nếu eval cần gọi thẳng nó.  # cần anh nếu có

capture:
  # Chụp-ra-FILE cho slideshow Cổng 2. Script thuộc repo (scripts/ui-capture.mjs),
  # chạy bằng @playwright/test repo đã có — không thêm phụ thuộc nào.
  # Ưu tiên Chromium của Playwright (CI cache sẵn), thiếu thì lùi về Chrome hệ thống.
  # Cú pháp: <url> <out.png> [--wait ms] [--full] [--w px] [--h px]
  ui: "node scripts/ui-capture.mjs"
feature_loop:
  suite_keys: [executors.test.api, executors.test.storage]
